<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B3B6E" />
  <meta name="color-scheme" content="light" />
  <title>LipaBill link</title>
  <meta name="description" content="Open this LipaBill link to copy payment details, finish in M-Pesa, or continue in the app." />
  <meta name="robots" content="noindex,nofollow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LipaBill" />
  <meta property="og:title" content="LipaBill payment link" />
  <meta property="og:description" content="Open this LipaBill link to copy payment details, finish in M-Pesa, or continue in the app." />
  <meta property="og:image" content="https://lipabill.app/opengraph-image" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="LipaBill payment link" />
  <meta name="twitter:description" content="Open this LipaBill link to copy payment details, finish in M-Pesa, or continue in the app." />
  <meta name="twitter:image" content="https://lipabill.app/opengraph-image" />
  <link rel="icon" href="/brand/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --canvas: #f4f7fc;
      --soft: #eef5ff;
      --ink: #0f1c33;
      --ink-soft: #3a4a66;
      --mute: #6b7a94;
      --line: #d8e2f0;
      --card: #ffffff;
      --accent: #2f6bff;
      --accent-deep: #1a3f9c;
      --on-accent: #ffffff;
      --danger: #dc2626;
      --money: #0f1c33;
      --radius: 18px;
      --font: "Montserrat", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(
          ellipse 70% 85% at 50% 52%,
          rgba(47, 107, 255, 0.18) 0%,
          rgba(47, 107, 255, 0.1) 28%,
          rgba(180, 205, 255, 0.12) 48%,
          transparent 72%
        ),
        radial-gradient(80% 55% at 50% 0%, #d9e8ff 0%, transparent 55%),
        radial-gradient(50% 45% at 0% 100%, rgba(47, 107, 255, 0.06) 0%, transparent 55%),
        radial-gradient(50% 45% at 100% 100%, rgba(47, 107, 255, 0.06) 0%, transparent 55%),
        var(--canvas);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding:
        max(28px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));
    }

    .watermark {
      position: absolute;
      inset-inline: 1rem;
      top: max(1.25rem, env(safe-area-inset-top));
      z-index: 0;
      margin: 0;
      text-align: center;
      font-size: clamp(3rem, 16vw, 5.5rem);
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 0.85;
      color: color-mix(in srgb, var(--accent) 26%, transparent);
      user-select: none;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(400px, 100%);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 2.5rem;
      animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      text-decoration: none;
      color: var(--ink);
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 9px;
    }

    .brand-name {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand-tag {
      margin-top: 2px;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--mute);
      letter-spacing: 0;
      text-transform: none;
    }

    .panel {
      background: color-mix(in srgb, var(--card) 95%, transparent);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 6px);
      padding: 20px 20px 16px;
      box-shadow: 0 18px 40px -28px rgba(15, 28, 51, 0.35);
      backdrop-filter: blur(2px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      margin: 8px 0 0;
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .lede {
      margin: 6px 0 0;
      color: var(--ink-soft);
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.45;
    }

    .hero {
      margin-top: 16px;
      border-radius: var(--radius);
      background: var(--soft);
      border: 1px solid color-mix(in srgb, var(--accent) 14%, var(--line));
      overflow: hidden;
    }

    .copy-row {
      width: 100%;
      min-height: 0;
      border-radius: 0;
      border: 0;
      border-top: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
      background: transparent;
      color: inherit;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      box-shadow: none;
      font: inherit;
      cursor: pointer;
      transition: background 0.12s ease, transform 0.12s ease;
    }

    .copy-row:first-child { border-top: 0; }

    .copy-row:hover { background: color-mix(in srgb, #fff 55%, transparent); }

    .copy-row:active { transform: scale(0.995); background: color-mix(in srgb, #fff 80%, transparent); }

    .copy-row-body { min-width: 0; flex: 1; }

    .copy-row-label {
      display: block;
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
    }

    .copy-row-value {
      display: block;
      margin-top: 4px;
      font-size: clamp(1.25rem, 1.05rem + 1.2vw, 1.45rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      word-break: break-word;
      font-variant-numeric: tabular-nums;
      color: var(--money);
    }

    .copy-row-value.compact {
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .copy-row-value.amount {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: clamp(1.2rem, 1.05rem + 0.9vw, 1.35rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .amount-currency {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--mute);
    }

    .copy-chip {
      flex-shrink: 0;
      border-radius: 999px;
      background: #fff;
      color: var(--accent);
      padding: 2px 8px;
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      box-shadow: 0 1px 0 rgba(15, 28, 51, 0.04);
    }

    .copy-row.hidden { display: none !important; }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 16px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      min-height: 44px;
      padding: 0 16px;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    }

    button:active { transform: scale(0.985); }

    .primary {
      background: var(--accent);
      color: var(--on-accent);
      box-shadow: 0 10px 22px -14px rgba(26, 63, 156, 0.85);
    }

    .primary:hover { background: var(--accent-deep); }

    .secondary {
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .secondary:hover { background: var(--soft); }

    .ghost {
      background: transparent;
      color: var(--accent);
      min-height: 40px;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .ghost:hover { background: color-mix(in srgb, var(--soft) 80%, transparent); }

    .hint {
      margin: 4px 0 0;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--mute);
      line-height: 1.4;
    }

    .loading-row {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--mute);
      font-size: 0.9375rem;
      font-weight: 500;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error .eyebrow { color: var(--danger); }
    .error .eyebrow-dot { background: var(--danger); }
    .error h1 { color: var(--ink); }

    .foot {
      text-align: center;
      color: var(--mute);
      font-size: 0.7rem;
      font-weight: 500;
      line-height: 1.45;
    }

    .foot a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(8px);
      background: var(--ink);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.8125rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <p class="watermark" aria-hidden="true">LipaBill</p>
  <main>
    <a class="brand" href="https://lipabill.app/" aria-label="LipaBill home">
      <img src="/brand/lipabill-logo.png" width="36" height="36" alt="" />
      <span>
        <span class="brand-name">LipaBill</span>
        <span class="brand-tag">Payment link</span>
      </span>
    </a>

    <section id="loading" class="panel">
      <div class="loading-row">
        <span class="spinner" aria-hidden="true"></span>
        <span>Opening link…</span>
      </div>
    </section>

    <section id="ok" class="panel hidden">
      <p class="eyebrow">
        <span class="eyebrow-dot" aria-hidden="true"></span>
        <span id="kindChip">Link</span>
      </p>
      <h1 id="title">Here’s a LipaBill link</h1>
      <p id="subtitle" class="lede"></p>

      <div class="hero">
        <button type="button" class="copy-row" id="destRow" aria-label="Copy destination">
          <span class="copy-row-body">
            <span class="copy-row-label" id="destLabel">Destination</span>
            <span class="copy-row-value" id="destValue"></span>
          </span>
          <span class="copy-chip">Copy</span>
        </button>
        <button type="button" class="copy-row hidden" id="accountRow" aria-label="Copy account">
          <span class="copy-row-body">
            <span class="copy-row-label">Account</span>
            <span class="copy-row-value compact" id="accountValue"></span>
          </span>
          <span class="copy-chip">Copy</span>
        </button>
        <button type="button" class="copy-row hidden" id="amountRow" aria-label="Copy amount">
          <span class="copy-row-body">
            <span class="copy-row-label">Amount</span>
            <span class="copy-row-value amount">
              <span class="amount-currency">KES</span>
              <span id="amountValue"></span>
            </span>
          </span>
          <span class="copy-chip">Copy</span>
        </button>
      </div>

      <div class="actions">
        <button type="button" class="primary" id="mpesaBtn">Open M-Pesa</button>
        <button type="button" class="ghost" id="appBtn">Open in LipaBill</button>
        <button type="button" class="ghost" id="storeBtn">Get LipaBill</button>
      </div>
      <p class="hint" id="actionHint">Tap each value to copy it, then finish in M-Pesa.</p>
    </section>

    <section id="err" class="panel error hidden">
      <p class="eyebrow">
        <span class="eyebrow-dot" aria-hidden="true"></span>
        Unavailable
      </p>
      <h1>This link isn’t valid anymore</h1>
      <p class="lede">Ask for a fresh one, or open M-Pesa and enter the details yourself.</p>
      <div class="actions">
        <button type="button" class="secondary" id="errMpesaBtn">Open M-Pesa</button>
        <button type="button" class="ghost" id="errStoreBtn">Get LipaBill</button>
      </div>
    </section>

    <p class="foot">
      Shared from LipaBill ·
      <a href="https://lipabill.app/">lipabill.app</a>
    </p>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="/p/paylink.js"></script>
  <script>
    (function () {
      var path = location.pathname.replace(/\/+$/, "");
      var parts = path.split("/");
      var token = parts[parts.length - 1];
      if (!token || token === "p" || token === "index.html") {
        token = (location.search.match(/[?&]t=([^&]+)/) || [])[1] || "";
      }
      token = decodeURIComponent(token || "");

      var loading = document.getElementById("loading");
      var ok = document.getElementById("ok");
      var err = document.getElementById("err");
      var toast = document.getElementById("toast");

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(function () { toast.classList.remove("show"); }, 1600);
      }

      function show(el) {
        loading.classList.add("hidden");
        ok.classList.add("hidden");
        err.classList.add("hidden");
        el.classList.remove("hidden");
      }

      var target = PayLinkWeb.parse(token) || PayLinkWeb.parse("https://lipabill.app/p/" + token);
      if (!target) {
        show(err);
      } else {
        var title = document.getElementById("title");
        var subtitle = document.getElementById("subtitle");
        var destLabel = document.getElementById("destLabel");
        var destValue = document.getElementById("destValue");
        var destRow = document.getElementById("destRow");
        var accountRow = document.getElementById("accountRow");
        var accountValue = document.getElementById("accountValue");
        var amountRow = document.getElementById("amountRow");
        var amountValue = document.getElementById("amountValue");
        var kindChip = document.getElementById("kindChip");
        var actionHint = document.getElementById("actionHint");

        function bindCopy(row, label, value, display) {
          row.setAttribute("aria-label", "Copy " + label + ": " + (display || value));
          row.onclick = function () {
            PayLinkWeb.copyText(value).then(
              function () { showToast("Copied " + label.toLowerCase()); },
              function () { showToast("Couldn’t copy"); }
            );
          };
        }

        var destMasked;
        if (target.kind === "PHONE") {
          kindChip.textContent = "Send money";
          title.textContent = "Send to this number";
          subtitle.textContent = "Tap the number to copy it, then finish in M-Pesa — or open LipaBill if you already have it.";
          destLabel.textContent = "Phone";
          destMasked = PayLinkWeb.maskPayIdentifier("PHONE", target.identifier);
          destValue.textContent = destMasked;
          actionHint.textContent = "Tap each value to copy, then paste it in M-Pesa Send money.";
        } else if (target.kind === "TILL") {
          kindChip.textContent = "Buy goods";
          title.textContent = "Pay this till";
          subtitle.textContent = "Tap the till to copy it, then use Buy Goods in M-Pesa — or open LipaBill if you already have it.";
          destLabel.textContent = "Till";
          destMasked = PayLinkWeb.maskPayIdentifier("TILL", target.identifier);
          destValue.textContent = destMasked;
          actionHint.textContent = "Tap each value to copy, then paste it in M-Pesa Buy Goods.";
        } else {
          kindChip.textContent = "Pay bill";
          title.textContent = "Pay this bill";
          subtitle.textContent = "Tap business number and account separately to copy each one — then finish Pay Bill in M-Pesa.";
          destLabel.textContent = "Business number";
          destMasked = PayLinkWeb.maskPayIdentifier("PAYBILL", target.identifier);
          destValue.textContent = destMasked;
          if (target.account) {
            var accountMasked = PayLinkWeb.maskCode(target.account);
            accountValue.textContent = accountMasked;
            accountRow.classList.remove("hidden");
            bindCopy(accountRow, "Account", target.account, accountMasked);
          }
          actionHint.textContent = "Tap each value to copy it on its own for M-Pesa Pay Bill.";
        }

        bindCopy(destRow, destLabel.textContent, target.identifier, destMasked);

        if (target.amountShillings) {
          amountValue.textContent = target.amountShillings.toLocaleString("en-KE");
          amountRow.classList.remove("hidden");
          bindCopy(amountRow, "Amount", String(target.amountShillings));
        }

        document.getElementById("mpesaBtn").onclick = function () {
          PayLinkWeb.openMpesa();
        };
        document.getElementById("appBtn").onclick = function () {
          PayLinkWeb.openLipaBill(token);
        };
        document.getElementById("storeBtn").onclick = function () {
          PayLinkWeb.getLipaBill();
        };
        show(ok);
      }

      document.getElementById("errMpesaBtn").onclick = function () {
        PayLinkWeb.openMpesa();
      };
      document.getElementById("errStoreBtn").onclick = function () {
        PayLinkWeb.getLipaBill();
      };
    })();
  </script>
</body>
</html>
