<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B3B6E" />
  <meta name="color-scheme" content="light" />
  <title>LipaBill link</title>
  <meta name="description" content="Open this LipaBill link to copy payment details, finish in M-Pesa, or continue in the app." />
  <meta name="robots" content="noindex,nofollow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LipaBill" />
  <meta property="og:title" content="LipaBill payment link" />
  <meta property="og:description" content="Open this LipaBill link to copy payment details, finish in M-Pesa, or continue in the app." />
  <meta property="og:image" content="https://lipabill.app/opengraph-image" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="LipaBill payment link" />
  <meta name="twitter:description" content="Open this LipaBill link to copy payment details, finish in M-Pesa, or continue in the app." />
  <meta name="twitter:image" content="https://lipabill.app/opengraph-image" />
  <link rel="icon" href="/brand/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --canvas: #f4f7fc;
      --soft: #eef5ff;
      --ink: #0f1c33;
      --ink-soft: #3a4a66;
      --mute: #6b7a94;
      --line: #d8e2f0;
      --card: #ffffff;
      --accent: #2f6bff;
      --accent-deep: #1a3f9c;
      --on-accent: #ffffff;
      --danger: #dc2626;
      --money: #0f1c33;
      --radius: 22px;
      --font: "Montserrat", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 50% -8%, rgba(47, 107, 255, 0.14), transparent 55%),
        var(--canvas);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding:
        max(32px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));
    }

    main {
      width: min(400px, 100%);
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      align-self: flex-start;
      text-decoration: none;
      color: var(--ink);
    }

    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
    }

    .brand-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand-tag {
      margin-top: 2px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--mute);
      letter-spacing: 0;
      text-transform: none;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 6px);
      padding: 24px 22px 20px;
      box-shadow: 0 18px 40px -28px rgba(15, 28, 51, 0.35);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      margin: 10px 0 0;
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.25;
    }

    .lede {
      margin: 8px 0 0;
      color: var(--ink-soft);
      font-size: 0.9375rem;
      font-weight: 500;
      line-height: 1.45;
    }

    .hero {
      margin-top: 20px;
      padding: 20px 18px;
      border-radius: var(--radius);
      background: var(--soft);
      border: 1px solid color-mix(in srgb, var(--accent) 14%, var(--line));
    }

    .hero-label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
    }

    .hero-value {
      margin-top: 6px;
      font-size: clamp(1.625rem, 1.2rem + 2.2vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.15;
      word-break: break-word;
      font-variant-numeric: tabular-nums;
      color: var(--money);
    }

    .hero-sub {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
      display: none;
    }

    .hero-sub.show { display: block; }

    .hero-sub-label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
    }

    .hero-sub-value {
      margin-top: 4px;
      font-size: 1.0625rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      word-break: break-word;
    }

    .amount {
      margin-top: 14px;
      display: none;
      align-items: baseline;
      gap: 6px;
    }

    .amount.show { display: flex; }

    .amount-currency {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--mute);
    }

    .amount-value {
      font-size: clamp(1.5rem, 1.15rem + 1.5vw, 1.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 20px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      min-height: 52px;
      padding: 0 16px;
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    }

    button:active { transform: scale(0.985); }

    .primary {
      background: var(--accent);
      color: var(--on-accent);
      box-shadow: 0 10px 22px -14px rgba(26, 63, 156, 0.85);
    }

    .primary:hover { background: var(--accent-deep); }

    .secondary {
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .secondary:hover { background: var(--soft); }

    .ghost {
      background: transparent;
      color: var(--accent);
      min-height: 44px;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .ghost:hover { background: color-mix(in srgb, var(--soft) 80%, transparent); }

    .hint {
      margin: 4px 0 0;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--mute);
      line-height: 1.4;
    }

    .loading-row {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--mute);
      font-size: 0.9375rem;
      font-weight: 500;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error .eyebrow { color: var(--danger); }
    .error .eyebrow-dot { background: var(--danger); }
    .error h1 { color: var(--ink); }

    .foot {
      text-align: center;
      color: var(--mute);
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.45;
    }

    .foot a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(8px);
      background: var(--ink);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 0.8125rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="https://lipabill.app/" aria-label="LipaBill home">
      <img src="/brand/lipabill-logo.png" width="36" height="36" alt="" />
      <span>
        <span class="brand-name">LipaBill</span>
        <span class="brand-tag">Payment link</span>
      </span>
    </a>

    <section id="loading" class="panel">
      <div class="loading-row">
        <span class="spinner" aria-hidden="true"></span>
        <span>Opening link…</span>
      </div>
    </section>

    <section id="ok" class="panel hidden">
      <p class="eyebrow">
        <span class="eyebrow-dot" aria-hidden="true"></span>
        <span id="kindChip">Link</span>
      </p>
      <h1 id="title">Here’s a LipaBill link</h1>
      <p id="subtitle" class="lede"></p>

      <div class="hero">
        <div class="hero-label" id="destLabel">Destination</div>
        <div class="hero-value" id="destValue"></div>
        <div class="hero-sub" id="accountRow">
          <div class="hero-sub-label">Account</div>
          <div class="hero-sub-value" id="accountValue"></div>
        </div>
        <div class="amount" id="amountRow">
          <span class="amount-currency">KES</span>
          <span class="amount-value" id="amountValue"></span>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="primary" id="copyBtn">Copy details</button>
        <button type="button" class="secondary" id="mpesaBtn">Open M-Pesa</button>
        <button type="button" class="ghost" id="appBtn">Open in LipaBill</button>
        <button type="button" class="ghost" id="storeBtn">Get LipaBill</button>
      </div>
      <p class="hint" id="actionHint">Most people copy the details, then finish in M-Pesa.</p>
    </section>

    <section id="err" class="panel error hidden">
      <p class="eyebrow">
        <span class="eyebrow-dot" aria-hidden="true"></span>
        Unavailable
      </p>
      <h1>This link isn’t valid anymore</h1>
      <p class="lede">Ask for a fresh one, or open M-Pesa and enter the details yourself.</p>
      <div class="actions">
        <button type="button" class="secondary" id="errMpesaBtn">Open M-Pesa</button>
        <button type="button" class="ghost" id="errStoreBtn">Get LipaBill</button>
      </div>
    </section>

    <p class="foot">
      Shared from LipaBill ·
      <a href="https://lipabill.app/">lipabill.app</a>
    </p>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="/p/paylink.js"></script>
  <script>
    (function () {
      var path = location.pathname.replace(/\/+$/, "");
      var parts = path.split("/");
      var token = parts[parts.length - 1];
      if (!token || token === "p" || token === "index.html") {
        token = (location.search.match(/[?&]t=([^&]+)/) || [])[1] || "";
      }
      token = decodeURIComponent(token || "");

      var loading = document.getElementById("loading");
      var ok = document.getElementById("ok");
      var err = document.getElementById("err");
      var toast = document.getElementById("toast");

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(function () { toast.classList.remove("show"); }, 1600);
      }

      function show(el) {
        loading.classList.add("hidden");
        ok.classList.add("hidden");
        err.classList.add("hidden");
        el.classList.remove("hidden");
      }

      var target = PayLinkWeb.parse(token) || PayLinkWeb.parse("https://lipabill.app/p/" + token);
      if (!target) {
        show(err);
      } else {
        var title = document.getElementById("title");
        var subtitle = document.getElementById("subtitle");
        var destLabel = document.getElementById("destLabel");
        var destValue = document.getElementById("destValue");
        var accountRow = document.getElementById("accountRow");
        var accountValue = document.getElementById("accountValue");
        var amountRow = document.getElementById("amountRow");
        var amountValue = document.getElementById("amountValue");
        var kindChip = document.getElementById("kindChip");
        var actionHint = document.getElementById("actionHint");
        var copyPayload = "";

        if (target.kind === "PHONE") {
          kindChip.textContent = "Send money";
          title.textContent = "Send to this number";
          subtitle.textContent = "Copy it, then finish the send in M-Pesa — or open LipaBill if you already have it.";
          destLabel.textContent = "Phone";
          destValue.textContent = target.identifier;
          copyPayload = target.identifier;
          actionHint.textContent = "Copy the number, then paste it in M-Pesa Send money.";
        } else if (target.kind === "TILL") {
          kindChip.textContent = "Buy goods";
          title.textContent = "Pay this till";
          subtitle.textContent = "Copy the till, then use Buy Goods in M-Pesa — or open LipaBill if you already have it.";
          destLabel.textContent = "Till";
          destValue.textContent = target.identifier;
          copyPayload = target.identifier;
          actionHint.textContent = "Copy the till, then paste it in M-Pesa Buy Goods.";
        } else {
          kindChip.textContent = "Pay bill";
          title.textContent = "Pay this bill";
          subtitle.textContent = "Copy business and account, then use Pay Bill in M-Pesa — or open LipaBill if you already have it.";
          destLabel.textContent = "Business number";
          destValue.textContent = target.identifier;
          accountValue.textContent = target.account || "";
          accountRow.classList.add("show");
          copyPayload = target.identifier + " " + (target.account || "");
          actionHint.textContent = "Copy both numbers, then paste them in M-Pesa Pay Bill.";
        }

        if (target.amountShillings) {
          amountValue.textContent = target.amountShillings.toLocaleString("en-KE");
          amountRow.classList.add("show");
          copyPayload += " KES " + target.amountShillings;
        }

        document.getElementById("copyBtn").onclick = function () {
          PayLinkWeb.copyText(copyPayload).then(
            function () { showToast("Copied — paste in M-Pesa"); },
            function () { showToast("Couldn’t copy"); }
          );
        };
        document.getElementById("mpesaBtn").onclick = function () {
          PayLinkWeb.openMpesa();
        };
        document.getElementById("appBtn").onclick = function () {
          PayLinkWeb.openLipaBill(token);
        };
        document.getElementById("storeBtn").onclick = function () {
          PayLinkWeb.getLipaBill();
        };
        show(ok);
      }

      document.getElementById("errMpesaBtn").onclick = function () {
        PayLinkWeb.openMpesa();
      };
      document.getElementById("errStoreBtn").onclick = function () {
        PayLinkWeb.getLipaBill();
      };
    })();
  </script>
</body>
</html>
