# Name of your application. Used to uniquely configure containers.
service: lipabill

# Name of the container image (pushed to the registry below).
image: mboyacodes-sketch/lipabill

# RETIRED from the home Mac (10.7.0.1): no Kamal app, no auto-restart.
# Canonical site is https://lipabill.app (Vercel).
# lipabill.mboya.dev is a Caddy 301 only — see config/Caddyfile.lipabill.
# To redeploy on a host again, add servers.web.hosts and restore the proxy block.
servers:
  web:
    hosts: []

# Proxy disabled while retired (was: shared kamal-proxy :3010, host lipabill.mboya.dev).
# proxy:
#   ssl: false
#   host: lipabill.mboya.dev
#   app_port: 3000
#   forward_headers: true
#   healthcheck:
#     path: /up
#     interval: 3
#     timeout: 5
#   run:
#     http_port: 3010
#     https_port: 3011
#     bind_ips:
#       - 127.0.0.1

# GitHub Container Registry (GHCR).
# Login username must be your personal GitHub user (PAT owner).
registry:
  server: ghcr.io
  username: mboya
  password:
    - KAMAL_REGISTRY_PASSWORD

# Deploy host is Apple Silicon (OrbStack) — must match linux/arm64.
builder:
  arch: arm64
  # Use the working tree so uncommitted files (e.g. /up) are included.
  context: .

# Give Next.js time to boot before kamal-proxy fails the healthcheck.
deploy_timeout: 60

# Runtime env injected into the container.
env:
  clear:
    NODE_ENV: production
    HOSTNAME: 0.0.0.0
    PORT: "3000"
  secret:
    - GOOGLE_SHEETS_WEBHOOK_URL

# Keep Next.js hashed static assets available across rolling deploys.
# Requires GNU cp on the host PATH (OrbStack Mac: ln -sf $(brew --prefix coreutils)/bin/gcp /usr/local/bin/cp).
asset_path: /app/.next/static

aliases:
  shell: app exec --interactive --reuse "sh"
  logs: app logs -f
  console: app exec --interactive --reuse "node"

# SSH user on the deploy host (MacBook Pro @ 10.7.0.1).
ssh:
  user: mizu

minimum_version: 2.12.0
